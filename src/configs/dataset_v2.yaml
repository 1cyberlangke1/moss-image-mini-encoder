# 数据集构建配置。
# 改这里会改变训练集构成，必须同步更新 dataset/manifest.json 里记录的配置快照。
# 所有源都钉死 revision（见 moss_small_encoder/build.py 的 SOURCE_REVISIONS）。

seed: 20261027

# MOSS-Image 的生成侧上限。超过这个 token 数的样本整条剔除，不截断：
# 截断会让「尾部 token」在推理时永远不存在，学了也没用。
max_tokens: 4096

min_chars: 12
# 字符粗筛上限，只用来提前丢掉明显超长的垃圾行；真正的判定靠 max_tokens。
max_chars: 20000

cache_dir: tmp/raw
out_dir: dataset

splits:
  train: 0.70
  val: 0.15
  test: 0.15

# 桶的先后顺序同时决定重复样本归谁：先处理的桶保留，后来的记为 duplicate。
#
# 配额原则：
# - 英文源近乎无限（jtatman 896,874 行 / gustavosta 73,718 行），放大成本低；
# - 中文原生有上限：shuixian 一共只有 5,430 条，清洗后能用的更少，
#   所以 zh_prose 的配额已经逼近供给上限，再想加只能靠 zh_extra / zh_tag / layout；
# - 合成桶（layout / zh_tag）可以无限出，但每条 token 多，会直接拉长 teacher 编码时间。
# - 中文 token 密度高，所以按条数看中文占比偏低，按 token 数看接近一半。
buckets:
  # 官方示例提示词只做测试集，不参与训练，用来做同分布保真度体检。
  - name: official
    kind: official
    source: moss_official
    quota: 40
    split: test

  # 合成 layout：公开语料里没有 MOSS schema 的 layout，只能自己拼。
  - name: layout
    kind: synth
    quota: 3000
    lang_mix: 0.5

  # 英文 tag / 混杂提示词，来自 Civitai。
  # scan_rows 控制实际读多少行：只读均匀散布的约 4 万行，不传 200 MB 全量。
  - name: en_tag
    kind: stream
    source: jtatman
    record: positive
    quota: 12000
    scan_rows: 40000

  # 英文散文，Gustavosta（需修复「8 k」这类分词伪影）。
  - name: en_prose
    kind: stream
    source: gustavosta
    record: positive
    quota: 8000
    scan_rows: 25000

  # 原生中文提示词（供给上限就在这附近）。
  - name: zh_prose
    kind: stream
    source: shuixian
    record: positive
    quota: 4000

  # 中文补充：gpt-image 双语数据里的中文侧，机翻，只用来补语体覆盖。
  # scan_bytes 控制抽样字节数：约 40 MB 的等距片段，不整包下 115.8 MB。
  - name: zh_extra
    kind: stream
    source: goku
    record: positive
    quota: 8000
    scan_bytes: 40000000

  # 中文标签流，由标签词表确定性组合。
  - name: zh_tag
    kind: tag_compose
    source: n714
    quota: 4000

  # 负面提示词也过同一个文本编码器，CFG 效果直接依赖它。
  - name: negative
    kind: stream
    source: jtatman
    record: negative
    quota: 800
    scan_rows: 15000

  # ---- 第二代新增：实体桶 ----
  # 只给名字，不给外观描述。实体名来自 Wikidata，类型 QID 由锚点实测确定。
  # min_sitelinks=0 表示低频实体也要，不做热度截断。
  - name: entity
    kind: enumerate
    entities: dataset/wikidata/entities.jsonl
    per_entity: 8
    min_sitelinks: 0
    quota: 2000000

  # ---- 第二代新增：二次元角色桶 ----
  # 名字来自 danbooru 的 character tag，低频角色也要（min_post_count=0）。
  # 同样只给名字、不配属性词：随机属性会给黑发角色配 blonde_hair，
  # 把错误绑定喂进教师喵。
  - name: characters
    kind: characters
    tags: dataset/danbooru_api/tags.jsonl
    per_character: 8
    min_post_count: 0
    quota: 2000000
